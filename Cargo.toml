[package]
name = "shep-discord"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
description = "A Discord dog for shep: streams sheep logs to a channel and drives the flock from slash commands"
repository = "https://github.com/shep-pm/shep-discord"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shep", "process-manager", "discord", "bot"]
categories = ["command-line-utilities"]
# `docs/` is this project's own planning and design notes, written by the
# skills that produced the code. They are worth keeping in the repository
# and are not worth shipping: a published .crate is permanent, so every
# draft in there would outlive the decisions it argues about, and docs.rs
# would carry them beside the API. The repository is where to read them.
exclude = ["/docs/"]

[dependencies]
# The only path to shep-core: `shep_client::shep_core`, never a second
# direct dependency. 0.16.1 is the floor for two reasons. `DogRuntime`, which
# every other dog starts on, and `Client::dog_config`, which asks for the
# section with `{{secret:...}}` references resolved so the bot token can be
# one, are both there. The older floors hold underneath, each one cleared by
# this version: the `dog_config` attribute (0.10.0) replaced the `DogConfig`
# derive and is what puts `x-shep-secret` on the field rather than on its
# name; `Request::HostUsage`, which `/system` is built on, arrived in 0.8.2;
# the `schema` feature forwards down to shep-core so `MemSize` and
# `UpDuration` carry their `JsonSchema` impls; and the protocol number a dog
# announces has to be at or above the shepherd's `MIN_SUPPORTED`, which
# announcing 11, shep-core 0.16.1's `PROTOCOL_VERSION`, clears (`MIN_SUPPORTED`
# is still 8).
shep-client = "0.16.1"
# `#[derive(JsonSchema)]` expands to absolute `schemars::` paths, so the
# crate has to be nameable here even though shep-client carries it.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# No `cache`: this dog holds its own state and a second copy would drift.
# No `framework`/`standard_framework`: those serve prefix commands, which
# have nothing to do with slash commands.
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "builder", "rustls_backend"] }

[dev-dependencies]
shep-client = { version = "0.16.1", features = ["test-support"] }
serde_json = "1"
tempfile = "3"

# The same profile settings shep and shep-log-rotate carry, for the same
# reasons. Debug info dominates a debug build and a dependency's is never
# what is being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed. Not `strip`, and not `panic = "abort"`: symbols are what
# a profiler names frames with, and `shep-client` re-raises a panicked task
# with `resume_unwind`, which needs a runtime that unwinds.
[profile.release]
lto = "thin"
codegen-units = 1
